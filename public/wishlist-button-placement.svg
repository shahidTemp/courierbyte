<svg width="1600" height="1040" viewBox="0 0 1600 1040" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Subtle wishlist placement for a Bangladesh ecommerce product page</title>
  <desc id="desc">A visual guide showing a compact heart icon beside the product title, while cart and order buttons remain the dominant actions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1600" y2="1040" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0F9FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="1040" fill="url(#background)"/>
  <circle cx="1480" cy="105" r="220" fill="#DFF4EA" opacity="0.55"/>
  <circle cx="70" cy="970" r="260" fill="#E0F2FE" opacity="0.65"/>

  <!-- Header -->
  <text x="800" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0F172A">Make wishlist a quiet secondary action</text>
  <text x="800" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">For a low-frequency feature, use a small heart beside the product title — not a third purchase button.</text>

  <!-- Main product page -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="170" width="690" height="690" rx="24" fill="white"/>
  </g>
  <rect x="90" y="170" width="690" height="76" rx="24" fill="#0F172A"/>
  <rect x="90" y="222" width="690" height="24" fill="#0F172A"/>
  <text x="126" y="218" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="white">Full product page</text>
  <text x="744" y="218" text-anchor="end" font-family="Arial, sans-serif" font-size="17" fill="#BAE6FD">productInfo.tsx</text>

  <g font-family="Arial, sans-serif">
    <!-- Title row with compact wishlist -->
    <text x="128" y="298" font-size="28" font-weight="700" fill="#1E293B">Premium product name</text>
    <rect x="684" y="266" width="42" height="42" rx="21" fill="white" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M705 295C703 293 694 287 694 280C694 276 697 273 701 273C703 273 705 274 705 277C705 274 707 273 710 273C714 273 716 276 716 280C716 287 707 293 705 295Z" fill="none" stroke="#64748B" stroke-width="2" stroke-linejoin="round"/>
    <text x="666" y="258" text-anchor="end" font-size="15" font-weight="700" fill="#E11D48">SMALL, OPTIONAL</text>
    <path d="M671 265C681 270 688 274 694 279" stroke="#E11D48" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="128" y="318" width="110" height="27" rx="13.5" fill="#DFF4EA"/>
    <text x="183" y="337" text-anchor="middle" font-size="14" font-weight="700" fill="#237A57">BEST SELLER</text>
    <text x="128" y="387" font-size="30" font-weight="700" fill="#0F172A">৳1,250</text>
    <text x="258" y="387" font-size="22" fill="#94A3B8" text-decoration="line-through">৳1,500</text>
    <rect x="376" y="361" width="122" height="34" rx="17" fill="#237A57"/>
    <text x="437" y="384" text-anchor="middle" font-size="15" font-weight="700" fill="white">250 টাকা ছাড়</text>
    <line x1="128" y1="420" x2="742" y2="420" stroke="#E2E8F0" stroke-width="2"/>

    <text x="128" y="459" font-size="16" font-weight="700" fill="#475569">Variant options</text>
    <rect x="128" y="476" width="86" height="36" rx="9" fill="#DFF4EA" stroke="#237A57" stroke-width="2"/>
    <text x="171" y="500" text-anchor="middle" font-size="15" fill="#237A57">Small</text>
    <rect x="226" y="476" width="86" height="36" rx="9" fill="white" stroke="#CBD5E1" stroke-width="2"/>
    <text x="269" y="500" text-anchor="middle" font-size="15" fill="#475569">Large</text>
    <text x="128" y="554" font-size="16" font-weight="700" fill="#475569">Quantity</text>
    <rect x="224" y="527" width="142" height="42" rx="8" fill="white" stroke="#237A57" stroke-width="2"/>
    <rect x="224" y="527" width="42" height="42" rx="8" fill="#DFF4EA"/>
    <rect x="324" y="527" width="42" height="42" rx="8" fill="#DFF4EA"/>
    <text x="245" y="555" text-anchor="middle" font-size="22" fill="#237A57">−</text>
    <text x="295" y="556" text-anchor="middle" font-size="18" font-weight="700" fill="#237A57">1</text>
    <text x="345" y="555" text-anchor="middle" font-size="22" fill="#237A57">+</text>

    <!-- Dominant purchase actions -->
    <rect x="128" y="600" width="294" height="54" rx="9" fill="white" stroke="#237A57" stroke-width="3"/>
    <text x="275" y="634" text-anchor="middle" font-size="17" font-weight="700" fill="#237A57">🛒  কার্টে যোগ করুন</text>
    <rect x="438" y="600" width="304" height="54" rx="9" fill="#237A57"/>
    <text x="590" y="634" text-anchor="middle" font-size="17" font-weight="700" fill="white">অর্ডার করুন</text>
    <text x="748" y="584" text-anchor="end" font-size="15" font-weight="700" fill="#237A57">KEEP THESE DOMINANT</text>
    <path d="M752 592C730 592 718 606 705 618" stroke="#237A57" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Contact actions remain below -->
    <line x1="128" y1="684" x2="742" y2="684" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="128" y="708" width="294" height="42" rx="8" fill="#2563EB"/>
    <text x="275" y="735" text-anchor="middle" font-size="14" font-weight="700" fill="white">কল করুন</text>
    <rect x="438" y="708" width="304" height="42" rx="8" fill="#16A34A"/>
    <text x="590" y="735" text-anchor="middle" font-size="14" font-weight="700" fill="white">হোয়াটসঅ্যাপে মেসেজ করুন</text>
    <text x="435" y="798" text-anchor="middle" font-size="15" fill="#64748B">The heart remains available, but does not take up a whole row.</text>
  </g>

  <!-- Quick view -->
  <g filter="url(#cardShadow)">
    <rect x="830" y="170" width="680" height="690" rx="24" fill="white"/>
  </g>
  <rect x="830" y="170" width="680" height="76" rx="24" fill="#0F172A"/>
  <rect x="830" y="222" width="680" height="24" fill="#0F172A"/>
  <text x="866" y="218" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="white">Quick view</text>
  <text x="1474" y="218" text-anchor="end" font-family="Arial, sans-serif" font-size="17" fill="#BAE6FD">ProductDetails</text>

  <rect x="866" y="284" width="230" height="230" rx="16" fill="#F1F5F9"/>
  <rect x="917" y="333" width="128" height="130" rx="12" fill="#DFF4EA"/>
  <path d="M936 367C936 350 950 338 966 338H996C1012 338 1026 350 1026 367V453H936V367Z" fill="#237A57" opacity="0.82"/>
  <path d="M955 338C955 321 968 310 981 310C994 310 1007 321 1007 338" stroke="#237A57" stroke-width="9" stroke-linecap="round"/>
  <circle cx="1005" cy="389" r="8" fill="#F0F9FF"/>
  <text x="981" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">product image</text>

  <g font-family="Arial, sans-serif">
    <!-- Compact quick-view title row -->
    <text x="1130" y="304" font-size="24" font-weight="700" fill="#1E293B">Premium product name</text>
    <rect x="1431" y="276" width="38" height="38" rx="19" fill="white" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M1450 302C1448 300 1442 296 1442 290C1442 286 1445 284 1448 284C1450 284 1450 286 1450 287C1450 286 1451 284 1454 284C1457 284 1459 286 1459 290C1459 296 1453 300 1450 302Z" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="1130" y="342" font-size="27" font-weight="700" fill="#0F172A">৳1,250</text>
    <line x1="1130" y1="365" x2="1474" y2="365" stroke="#E2E8F0" stroke-width="2"/>
    <text x="1130" y="399" font-size="15" font-weight="700" fill="#475569">Choose a variant</text>
    <rect x="1130" y="414" width="74" height="32" rx="8" fill="#DFF4EA" stroke="#237A57" stroke-width="2"/>
    <text x="1167" y="435" text-anchor="middle" font-size="14" fill="#237A57">Small</text>
    <rect x="1214" y="414" width="74" height="32" rx="8" fill="white" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1251" y="435" text-anchor="middle" font-size="14" fill="#475569">Large</text>
    <text x="1130" y="485" font-size="15" font-weight="700" fill="#475569">Quantity</text>
    <rect x="1194" y="462" width="124" height="37" rx="7" fill="white" stroke="#237A57" stroke-width="2"/>
    <text x="1212" y="486" text-anchor="middle" font-size="20" fill="#237A57">−</text>
    <text x="1256" y="487" text-anchor="middle" font-size="16" font-weight="700" fill="#237A57">1</text>
    <text x="1300" y="486" text-anchor="middle" font-size="20" fill="#237A57">+</text>

    <rect x="1130" y="535" width="164" height="50" rx="8" fill="white" stroke="#237A57" stroke-width="2.5"/>
    <text x="1212" y="566" text-anchor="middle" font-size="14" font-weight="700" fill="#237A57">কার্টে যোগ করুন</text>
    <rect x="1306" y="535" width="168" height="50" rx="8" fill="#237A57"/>
    <text x="1390" y="566" text-anchor="middle" font-size="14" font-weight="700" fill="white">অর্ডার করুন</text>
    <line x1="1130" y1="620" x2="1474" y2="620" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="1130" y="644" width="164" height="40" rx="8" fill="#2563EB"/>
    <text x="1212" y="669" text-anchor="middle" font-size="13" font-weight="700" fill="white">কল করুন</text>
    <rect x="1306" y="644" width="168" height="40" rx="8" fill="#16A34A"/>
    <text x="1390" y="669" text-anchor="middle" font-size="13" font-weight="700" fill="white">WhatsApp</text>
    <text x="1302" y="746" text-anchor="middle" font-size="15" fill="#64748B">Same compact treatment in quick view.</text>
  </g>

  <!-- Bottom recommendation -->
  <rect x="90" y="902" width="1420" height="92" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/>
  <circle cx="132" cy="948" r="11" fill="#E11D48"/>
  <text x="160" y="955" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1E293B">Recommendation</text>
  <text x="354" y="955" font-family="Arial, sans-serif" font-size="18" fill="#475569">Use one small outlined heart beside the title, matching the heart already used on product cards.</text>
  <text x="1468" y="955" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#237A57">No full-width wishlist button</text>
</svg>
